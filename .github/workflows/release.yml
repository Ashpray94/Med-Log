# Builds on pushes/manual runs; prod publishes require PUBLISH=yes on main/master/master-ejlvhp. Signed manual codex/medlog-system-audit runs publish dev-latest.
# Published releases include latest.json, which the app's updater reads (Settings → Check for updates).
#
# Signing: one Actions secret, MEDLOG_SIGNING, holding
#     storePassword=...
#     keyAlias=...
#     keyPassword=...
#     keystore=<the .jks file in base64, one line>
# Every release must be signed with that same key, or phones can't update. Without the secret (a fork, or a
# fresh copy) the build and tests still run, but nothing is published.
name: Release

on:
  push:
    branches: [main, master, master-ejlvhp]
    paths-ignore: ["README.md", "PLAN.md", "RELEASE_NOTES.md", "docs/**", "design/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/medlog-system-audit' && 'medlog-dev-latest' || format('medlog-release-{0}', github.ref) }}
      cancel-in-progress: false
    env:
      SIGNING: ${{ secrets.MEDLOG_SIGNING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        run: |
          K="$RUNNER_TEMP/medlog.jks"
          if [ -n "$SIGNING" ]; then
            printf '%s\n' "$SIGNING" > "$RUNNER_TEMP/signing.txt"
            grep -oP '^keystore=\K.*' "$RUNNER_TEMP/signing.txt" | base64 -d > "$K"
            P="$RUNNER_TEMP/signing.txt"
            PUBLISH=yes
          elif [ -f signing/release.properties ]; then
            cp signing/medlog-release.jks "$K"; P=signing/release.properties
            PUBLISH=yes
          else
            P="$RUNNER_TEMP/oneoff.txt"; PW="$(openssl rand -hex 16)"
            printf 'storePassword=%s\nkeyAlias=medlog\nkeyPassword=%s\n' "$PW" "$PW" > "$P"
            keytool -genkeypair -keystore "$K" -storepass "$PW" -keypass "$PW" -alias medlog -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MedLog"
            PUBLISH=no
          fi
          SP="$(grep -oP '^storePassword=\K.*' "$P")"; KA="$(grep -oP '^keyAlias=\K.*' "$P")"; KP="$(grep -oP '^keyPassword=\K.*' "$P")"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          rm -f "$RUNNER_TEMP/signing.txt"
          { echo "MEDLOG_STORE_FILE=$K"; echo "MEDLOG_STORE_PASSWORD=$SP"; echo "MEDLOG_KEY_ALIAS=$KA"
            echo "MEDLOG_KEY_PASSWORD=$KP"; echo "PUBLISH=$PUBLISH"; } >> "$GITHUB_ENV"

      - name: Clinical completeness
        run: |
          python3 tools/merge_audit.py --check
          python3 tools/lint_completeness.py || echo "::warning::clinical completeness gaps remain (see docs/HANDOFF.md); make this step blocking once the gap count is zero"

      - name: Set signed dev version code
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/medlog-system-audit'
        run: |
          echo "DEV_VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "DEV_VERSION_NAME=2.15.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test and build
        run: gradle --no-daemon :app:testProdDebugUnitTest :app:assembleProdRelease :app:assembleDevRelease

      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            app/build/test-results/testProdDebugUnitTest/*.xml
            app/schemas/com.suryaprakash.medlog.data.MedDb/5.json

      - name: Name the files
        id: files
        run: |
          V="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          C="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          mkdir out
          cp "$(ls app/build/outputs/apk/prod/release/*arm64-v8a*.apk | head -1)" "out/MedLog-$V-arm64.apk"
          cp "$(ls app/build/outputs/apk/prod/release/*armeabi-v7a*.apk | head -1)" "out/MedLog-$V-armv7.apk"
          sed "s/VERSION/$V/g" RELEASE_NOTES.md > out/notes.md
          sed -n '/## What.s new/,$p' out/notes.md | grep '^- ' | sed 's/\*\*//g' > out/short.txt
          python3 scripts/app_release.py out "$V" "$C" out out/short.txt --release
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # dev build: separate app (MedLog Dev, id .dev) that installs next to the real one
      - name: Dev APK
        run: |
          mkdir dev-out
          cp "$(ls app/build/outputs/apk/dev/release/*arm64-v8a*.apk | head -1)" dev-out/MedLog-dev-arm64.apk
          cp "$(ls app/build/outputs/apk/dev/release/*x86_64*.apk | head -1)" dev-out/MedLog-dev-x86_64-emulator.apk
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/codex/medlog-system-audit ]; then
            VCODE=$((300000 + GITHUB_RUN_NUMBER))
            python3 - "$VCODE" <<'PY'
          import hashlib, json, os, pathlib, sys
          code = int(sys.argv[1])
          apk = {}
          for name, abi in (("MedLog-dev-arm64.apk", "arm64-v8a"), ("MedLog-dev-x86_64-emulator.apk", "x86_64")):
              path = pathlib.Path("dev-out") / name
              apk[abi] = {
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/dev-latest/{name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }
          manifest = {
              "versionCode": code,
              "versionName": f"{os.environ['DEV_VERSION_NAME']}-dev",
              "notes": "Latest signed MedLog development test build.",
              "apk": apk,
          }
          pathlib.Path("dev-out/latest-dev.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MedLog-dev
          path: dev-out/*

      - name: Publish signed dev prerelease
        if: env.PUBLISH == 'yes' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/medlog-system-audit'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: MedLog Dev (latest audit build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dev-out/*
          body: Signed development builds for the system audit branch. This prerelease does not update the production latest release.

      # the app files stay with the run even when nothing is published
      - uses: actions/upload-artifact@v4
        with:
          name: MedLog-${{ steps.files.outputs.version }}
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'yes' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/master-ejlvhp')
        # some repositories don't let workflows make releases; the build itself still counts
        continue-on-error: true
        with:
          tag_name: v${{ steps.files.outputs.version }}
          name: MedLog ${{ steps.files.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.apk
            out/latest.json
          body_path: out/notes.md
          make_latest: true
